# PokePing Configuration
# Copy to config.local.yaml for local overrides

# Discord webhook URL for sending alerts
discord_webhook_url: ""

# How often to check each retailer (seconds)
poll_interval: 60

# Request timeout (seconds)
request_timeout: 15

# User agent for requests
user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# Affiliate tag configs (leave empty to disable)
affiliate:
  amazon_tag: ""        # e.g., "pokeping-20"
  target_tag: ""        # Target Circle partner ID
  walmart_tag: ""       # Walmart affiliate ID

# Retailer-specific settings
retailers:
  target:
    enabled: true
    poll_interval: 45   # Override global interval
  walmart:
    enabled: true
    poll_interval: 45
  amazon:
    enabled: true
    poll_interval: 60
  bestbuy:
    enabled: true
    poll_interval: 60
  pokemoncenter:
    enabled: true
    poll_interval: 30
  gamestop:
    enabled: true
    poll_interval: 60
  tcgplayer:
    enabled: true
    poll_interval: 90
  costco:
    enabled: true
    poll_interval: 60
  samsclub:
    enabled: true
    poll_interval: 60
  barnesnoble:
    enabled: true
    poll_interval: 60
  macys:
    enabled: true
    poll_interval: 60
  hottopic:
    enabled: true
    poll_interval: 60
  booksamillion:
    enabled: true
    poll_interval: 60
  lowes:
    enabled: true
    poll_interval: 90
  acehardware:
    enabled: true
    poll_interval: 90
  menards:
    enabled: true
    poll_interval: 90
  dicks:
    enabled: true
    poll_interval: 90
  buckscardshop:
    enabled: true
    poll_interval: 60
  forgeandfire:
    enabled: true
    poll_interval: 60
  amenerds:
    enabled: true
    poll_interval: 60
  pokene:
    enabled: true
    poll_interval: 60
  rarecandy:
    enabled: true
    poll_interval: 60

