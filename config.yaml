# PokePing Configuration
# Copy to config.local.yaml for local overrides

# Discord webhook URL for sending alerts
discord_webhook_url: ""

# How often to check each retailer (seconds)
poll_interval: 60

# Request timeout (seconds)
request_timeout: 15

# User agent for requests
user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# Affiliate tag configs (leave empty to disable)
affiliate:
  amazon_tag: ""        # e.g., "pokeping-20"
  target_tag: ""        # Target Circle partner ID
  walmart_tag: ""       # Walmart affiliate ID

# Retailer-specific settings
retailers:
  target:
    enabled: true
    poll_interval: 45   # Override global interval
  walmart:
    enabled: true
    poll_interval: 45
  amazon:
    enabled: true
    poll_interval: 60
  bestbuy:
    enabled: true
    poll_interval: 60
  pokemoncenter:
    enabled: true
    poll_interval: 30
  gamestop:
    enabled: true
    poll_interval: 60
  tcgplayer:
    enabled: true
    poll_interval: 90
  costco:
    enabled: true
    poll_interval: 60
  samsclub:
    enabled: true
    poll_interval: 60
  barnesnoble:
    enabled: true
    poll_interval: 60

# Products to monitor
# Each product needs at minimum a name and at least one retailer URL/ID
# Optional: set "msrp" to filter out above-MSRP scalper prices
products:
  - name: "Phantasmal Flames Booster Bundle (6 Packs)"
    msrp: 29.99
    urls:
      target: "https://www.target.com/p/pok-233-mon-trading-card-game-mega-evolution-8212-phantasmal-flames-booster-bundle/-/A-94884496"
      walmart: "https://www.walmart.com/ip/POKEMON-ME2-PHANTASMAL-FLAMES-BOOSTER-BUNDLE/17785924366"
      amazon: "https://www.amazon.com/Pok%C3%A9mon-TCG-Evolution-Phantasmal-Flames-Booster/dp/B0FTF6TC43"
      bestbuy: "https://www.bestbuy.com/product/pokemon-trading-card-game-mega-evolution-phantasmal-flames-6pk-booster-bundle/JJG2TL3XY4"
      pokemoncenter: "https://www.pokemoncenter.com/product/10-10191-109/pokemon-tcg-mega-evolution-phantasmal-flames-booster-bundle-6-packs"
      gamestop: "https://www.gamestop.com/toys-games/trading-cards/products/pokemon-trading-card-game-phantasmal-flames-booster-bundle/20027390.html"
      tcgplayer: "https://www.tcgplayer.com/product/654160/pokemon-me02-phantasmal-flames-phantasmal-flames-booster-bundle"
      barnesnoble: "https://www.barnesandnoble.com/w/pokemon-mega-evolution-s1-booster-bundle-box-pokemon/1148312555"
      # costco: Not listed yet — check back when Costco lists Pokemon ME2 bundles
      # samsclub: Not listed yet — check back when Sam's Club lists Pokemon ME2 bundles

# Example of adding more products:
# - name: "Pokemon TCG Prismatic Evolutions Elite Trainer Box"
#   msrp: 49.99
#   urls:
#     target: "https://www.target.com/p/-/A-12345678"
#     walmart: "https://www.walmart.com/ip/12345678"

# Keyword monitoring - watch for new Pokemon TCG listings
keywords:
  - "pokemon tcg"
  - "pokemon cards"
  - "pokemon elite trainer box"
  - "pokemon booster box"
  - "pokemon booster bundle"
  - "pokemon collection"
